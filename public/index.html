<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cobra Online</title>
<style>
:root{--bg:#0d2b22;--grid:#12382d;--ink:#f4f1de;--acc:#ffd23f}
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%;align-items:center}
#hud{width:100%;display:flex;justify-content:space-between;padding:8px 12px;font-size:14px}
canvas{flex:1;min-height:0;max-width:100%;aspect-ratio:1;background:var(--grid);border:2px solid #1f5c4a;border-radius:6px}
#menu{position:fixed;inset:0;background:#0d2b22ee;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center}
#menu h1{margin:0;font-size:44px;color:var(--acc);letter-spacing:-1px}
input,button{font:inherit;padding:14px 18px;border-radius:10px;border:0;width:100%;max-width:280px}
input{background:#16463a;color:var(--ink);text-align:center}
button{background:var(--acc);color:#1a1a1a;font-weight:700}
#lb{position:absolute;top:44px;right:10px;font-size:12px;background:#0008;padding:6px 10px;border-radius:8px;min-width:110px}
</style></head><body>
<div id="wrap"><div id="hud"><span id="sc">Pontos: 0</span><span id="on">Online: 0</span></div>
<canvas id="c"></canvas></div><div id="lb"></div>
<div id="menu"><h1>Cobra Online</h1><p id="msg">Jogue contra jogadores de todo o Brasil.</p>
<input id="nm" maxlength="12" placeholder="Seu apelido"><button id="go">Jogar</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let ws,me,W=40,H=40,st=null,tries=0;
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host);
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.t==='init'){me=d.id;W=d.w;H=d.h;}
    else if(d.t==='s'){st=d;$('on').textContent='Online: '+d.on;
      if(d.sc!==null)$('sc').textContent='Pontos: '+d.sc;
      $('lb').innerHTML=d.lb.map((r,i)=>(i+1)+'. '+r[0].replace(/</g,'&lt;')+' '+r[1]).join('<br>');}
    else if(d.t==='dead'){$('msg').textContent='Você fez '+d.score+' pontos. Tente de novo!';$('go').textContent='Jogar de novo';$('menu').style.display='flex';}};
  ws.onclose=()=>{$('msg').textContent='Conexão perdida. Reconectando…';$('menu').style.display='flex';setTimeout(connect,Math.min(5000,1000*++tries));};
  ws.onopen=()=>tries=0;
}
connect();
$('go').onclick=()=>{if(ws.readyState!==1)return;ws.send(JSON.stringify({t:'join',name:$('nm').value||'Cobra'}));$('menu').style.display='none';};
const send=d=>ws&&ws.readyState===1&&ws.send(JSON.stringify({t:'dir',d}));
addEventListener('keydown',e=>{const k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];if(k!==undefined)send(k);});
let sx,sy;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)<25&&Math.abs(dy)<25)return;
  send(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
function draw(){
  const s=Math.min(innerWidth,innerHeight-50);cv.width=cv.height=s*devicePixelRatio;cv.style.width=cv.style.height=s+'px';
  const u=cv.width/W;ctx.clearRect(0,0,cv.width,cv.height);
  if(st){
    ctx.fillStyle='#ff6b35';for(let i=0;i<st.f.length;i+=2){ctx.beginPath();ctx.arc((st.f[i]+.5)*u,(st.f[i+1]+.5)*u,u*.35,0,7);ctx.fill();}
    for(const p of st.sn){ctx.fillStyle=p.c;
      for(let i=0;i<p.b.length;i+=2){const r=i?.08:0;ctx.globalAlpha=p.id===me?1:.85;ctx.fillRect(p.b[i]*u+u*(.06),p.b[i+1]*u+u*.06,u*.88,u*.88);}
      ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font=(u*.6)+'px system-ui';ctx.textAlign='center';
      ctx.fillText(p.n,p.b[0]*u+u/2,p.b[1]*u-u*.2);}
  }
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
